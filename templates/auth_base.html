<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }} · SBM</title><link rel="stylesheet" href="{{ url_for('static', filename='css/sbm.css') }}">
</head>
<body><main class="auth-page"><h1>{{ title }}</h1>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
<p class="hint"><a href="{{ url_for('index') }}">Back to transfers</a></p></main></body></html>
